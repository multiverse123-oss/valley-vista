dbs:
  - path: /app/pb_data/data.db
    replicas:
      - type: s3
        endpoint: https://s3.us-west-4.idrivee2.com
        bucket: ${IDRIVE_BUCKET}
        path: pocketbase-data
        access-key-id: ${IDRIVE_ACCESS_KEY_ID}
        secret-access-key: ${IDRIVE_SECRET_ACCESS_KEY}
        region: ${IDRIVE_REGION}
        force-path-style: true
